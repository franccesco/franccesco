<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francesco Orozco — AI Engineer &amp; Data Scientist</title>
<meta name="description" content="Francesco Orozco — AI Engineer &amp; Data Scientist at Bloom Growth. Building agentic systems, interactive AI experiences, and the data pipelines underneath.">
<meta property="og:title" content="Francesco Orozco — AI Engineer &amp; Data Scientist">
<meta property="og:description" content="Building agentic systems, interactive AI experiences, and the data pipelines underneath.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f0d0a">
<link rel="icon" type="image/svg+xml" href="assets/monogram.svg">
<!-- Every page lists articles; main.jsx waits for this file before drawing. -->
<link rel="preload" href="articles/index.json" as="fetch" crossorigin>
<script>
  // Apply the saved theme before first paint. Older builds stored "paper" and "midnight".
  (function () {
    var theme = 'dark';
    try {
      var saved = localStorage.getItem('fo:theme');
      theme = { light: 'light', cream: 'cream', paper: 'cream' }[saved] || 'dark';
    } catch (error) {}
    document.documentElement.dataset.theme = theme;

    // Start the downloads the first screen needs while the app script loads.
    function hint(attributes) {
      var link = document.createElement('link');
      for (var name in attributes) link.setAttribute(name, attributes[name]);
      document.head.appendChild(link);
    }
    var article = /^#\/?writing\/([\w-]+)/.exec(location.hash);
    if (article) {
      // An article: its text, and the script that renders it (see content.js).
      hint({ rel: 'preload', as: 'fetch', crossorigin: '', href: 'articles/' + article[1] + '.md' });
      hint({ rel: 'modulepreload', href: 'build/chunks/markdown.js' });
    } else if (!/^#\/?contact/.test(location.hash)) {
      // The homepage: the portrait, its largest element. Keep imagesrcset and
      // imagesizes the same as the <img> in Landing.jsx.
      hint({
        rel: 'preload',
        as: 'image',
        fetchpriority: 'high',
        imagesrcset: 'assets/portrait-320.webp 320w, assets/portrait-400.webp 400w, assets/portrait-640.webp 640w, assets/portrait-800.webp 800w',
        imagesizes: '(max-width: 600px) 100vw, (max-width: 820px) 40vw, 384px',
      });
    }
  })();
</script>
<link rel="stylesheet" href="site.css">

<script type="module" src="build/app.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
